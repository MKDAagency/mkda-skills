<!doctype html>
<html lang="{{LANG}}">
<head><meta charset="utf-8"><title>{{BRAND}}</title><link rel="stylesheet" href="assets/theme.css"><script src="assets/gsap.min.js"></script>
<style>
  body, #root { width:1080px; height:{{HEIGHT}}px; overflow:hidden; background:var(--bg); }
  #root { position:relative; }
  .scene { position:absolute; inset:0; padding:200px 90px 340px; display:flex; flex-direction:column; justify-content:center; gap:48px; visibility:hidden; opacity:0; }
  .scene.first { visibility:visible; opacity:1; }
</style></head>
<body data-format="{{FORMAT}}">
<div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="{{HEIGHT}}">
  <!-- a working skeleton: redesign scenes, framing and transitions for each reel -->
  <div class="scene first dark" id="s1"><h1 data-line>[THE QUESTION]</h1><p data-line>[THE REAL THING, ALREADY VISIBLE]</p></div>
  <div class="scene" id="s2"><div class="step">1</div><h2 data-line>[FIRST THING]</h2></div>
  <div class="scene dark" id="s3"><h2 data-line>[SECOND THING]</h2><p data-line>[ONE SENTENCE]</p></div>
  <div class="scene" id="s4"><h2 data-line>[THE ANSWER]</h2><p data-line class="handle">{{HANDLE}}</p></div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  const cut = (from, to, t) => tl.set(from, { autoAlpha: 0 }, t).set(to, { autoAlpha: 1 }, t);
  cut("#s1", "#s2", 5);
  tl.from("#s2 .step", { scale: 0.6, opacity: 0, duration: 0.5, ease: "power3.out" }, 5.05)
    .from("#s2 h2", { x: 90, opacity: 0, duration: 0.5, ease: "expo.out" }, 5.2);
  cut("#s2", "#s3", 10);
  tl.from("#s3 h2", { clipPath: "inset(0 100% 0 0)", duration: 0.6, ease: "power2.inOut" }, 10)
    .from("#s3 p", { y: 50, opacity: 0, duration: 0.5, ease: "power3.out" }, 10.4);
  cut("#s3", "#s4", 15);
  tl.from("#s4 h2", { y: 80, opacity: 0, duration: 0.6, ease: "power3.out" }, 15)
    .from("#s4 p", { opacity: 0, duration: 0.5 }, 15.6);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
